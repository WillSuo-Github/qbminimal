name: Release

# Pushing a tag like v1.1.0 builds the release zip, checks it, and publishes it on GitHub with
# its SHA-256 checksum. The tag has to match the version in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: sha256sum qbminimal-release.zip > qbminimal-release.zip.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" qbminimal-release.zip qbminimal-release.zip.sha256 --title "qbminimal $GITHUB_REF_NAME" --generate-notes --verify-tag
