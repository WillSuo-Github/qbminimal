<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>qBittorrent</title>
    <!-- Built with a hash in the name, so a new icon shows at once, even though qBittorrent tells
         browsers to keep images for a week. -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" href="/src/assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/src/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- Added to a phone's home screen, it opens like an app, drawing under the status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="qBittorrent" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iPhone Safari would otherwise turn numbers such as peer addresses into phone links in its
         own link color, which can be hard to read on the page. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfdfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181c" />
    <!-- The title font is needed straight away, so it isn't shown in a stand-in font first. -->
    <link rel="preload" href="/src/assets/fonts/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
